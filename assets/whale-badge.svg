<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 48" fill="none" role="img" aria-label="大肥鱼">
  <defs>
    <linearGradient id="bodyLight" x1="8" y1="10" x2="48" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.52" stop-color="#0284c7"/>
      <stop offset="1" stop-color="#0f4c75"/>
    </linearGradient>
    <linearGradient id="belly" x1="12" y1="24" x2="36" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0f9ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#bae6fd" stop-opacity="0.88"/>
    </linearGradient>
  </defs>
  <!-- 喷水水花 -->
  <path d="M22 12 C22 7, 17 4, 14 5 M24 12 C24 6, 29 3, 32 5 M23 12 L23 4" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="13" cy="8" r="1.4" fill="#7dd3fc"/>
  <circle cx="33" cy="8" r="1.4" fill="#7dd3fc"/>
  <!-- 尾鳍 -->
  <path d="M46 26 C52 21, 58 15, 61 16 C61 21, 57 25, 53 27 C57 29, 61 33, 60 37 C56 37, 50 32, 46 28 Z" fill="url(#bodyLight)"/>
  <!-- 圆滚滚的大肥鱼身体 -->
  <ellipse cx="27" cy="27" rx="20" ry="13.5" fill="url(#bodyLight)"/>
  <!-- 肚皮高光与条纹 -->
  <path d="M10 29 C14 36, 28 39, 41 33 C36 39, 17 40, 10 29 Z" fill="url(#belly)"/>
  <!-- 可爱大眼睛 -->
  <circle cx="16.5" cy="24.5" r="2.6" fill="#082f49"/>
  <circle cx="15.7" cy="23.7" r="1" fill="#ffffff"/>
  <!-- 腮红 -->
  <ellipse cx="13.5" cy="27.8" rx="2.1" ry="1.1" fill="#f472b6" opacity="0.65"/>
  <!-- 小胸鳍 -->
  <path d="M24 32 C22 37, 27 40, 31 37 C29 35, 27 33, 24 32 Z" fill="#0369a1"/>
</svg>

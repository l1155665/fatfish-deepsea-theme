<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="深海：只有发光气泡">
  <defs>
    <linearGradient id="deep" x1="0.1" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#030c15"/>
      <stop offset="0.5" stop-color="#082132"/>
      <stop offset="1" stop-color="#0d384e"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#1d7f9b" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#135b74" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#0a2b3e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bubble" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#d8fbff" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#8ce9fb" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8ce9fb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="jelly" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#b6f0ff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#3f9fc0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#deep)"/>
  <rect width="1600" height="1000" fill="url(#bloom)"/>

  <g opacity="0.28">
    <polygon points="360,0 430,0 300,1000 190,1000" fill="#2f9fbf" opacity="0.16"/>
    <polygon points="620,0 680,0 560,1000 470,1000" fill="#2f9fbf" opacity="0.12"/>
    <polygon points="1180,0 1230,0 1120,1000 1030,1000" fill="#2f9fbf" opacity="0.1"/>
  </g>

  <g opacity="0.7">
    <ellipse cx="1180" cy="380" rx="80" ry="72" fill="url(#jelly)"/>
    <path d="M1146 424 C1156 486 1144 518 1130 566 M1180 432 C1184 500 1174 530 1166 572 M1214 424 C1206 486 1216 518 1230 560" stroke="#8ce9fb" stroke-opacity="0.42" stroke-width="4" fill="none"/>
  </g>

  <g>
    <circle cx="300" cy="780" r="16" fill="url(#bubble)"><animate attributeName="cy" from="900" to="-80" dur="30s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="30s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="700" r="10" fill="url(#bubble)"><animate attributeName="cy" from="920" to="-70" dur="34s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="34s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="760" r="7" fill="url(#bubble)"><animate attributeName="cy" from="900" to="-60" dur="24s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.85;0" dur="24s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="820" r="12" fill="url(#bubble)"><animate attributeName="cy" from="950" to="-80" dur="44s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.75;0" dur="44s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="720" r="7" fill="url(#bubble)"><animate attributeName="cy" from="900" to="-60" dur="26s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.85;0" dur="26s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="860" r="9" fill="url(#bubble)"><animate attributeName="cy" from="960" to="-70" dur="36s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="36s" repeatCount="indefinite"/></circle>
    <circle cx="1260" cy="840" r="13" fill="url(#bubble)"><animate attributeName="cy" from="960" to="-90" dur="40s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="40s" repeatCount="indefinite"/></circle>
    <circle cx="1470" cy="700" r="8" fill="url(#bubble)"><animate attributeName="cy" from="900" to="-60" dur="32s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="32s" repeatCount="indefinite"/></circle>
  </g>

  <g fill="#5fd3e8" opacity="0.3">
    <path d="M600 300 l24 -11 0 22 z"/>
    <path d="M640 326 l20 -9 0 18 z"/>
    <path d="M560 348 l18 -8 0 16 z"/>
  </g>
</svg>